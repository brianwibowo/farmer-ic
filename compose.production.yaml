name: farmer-ic

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: ${APP_IMAGE:-farmer-ic}:${APP_TAG:-latest}
        ports:
            - '127.0.0.1:${APP_PORT:-8080}:80'
        env_file:
            - path: .env.production
              required: false
        environment:
            APP_ENV: production
            APP_DEBUG: 'false'
            APP_URL: ${APP_URL:-https://farmer.icdigital.io}
            DB_CONNECTION: sqlite
            DB_DATABASE: /var/lib/farmer-ic/database.sqlite
            SESSION_DRIVER: file
            CACHE_STORE: file
            QUEUE_CONNECTION: sync
        networks:
            default: {}
            proxy:
                aliases:
                    - farmer-ic-app
        volumes:
            - app_storage:/var/www/html/storage
            - app_database:/var/lib/farmer-ic
        restart: unless-stopped

volumes:
    app_storage:
    app_database:

networks:
    default:
    proxy:
        external: true
        name: ${PROXY_NETWORK:-outline_default}
