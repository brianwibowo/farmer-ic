name: farmer-ic

# Supply the existing database and secrets through --env-file .env.production.
# Never switch a running SQLite/legacy database to the UUID schema implicitly.
x-app-environment: &app-environment
    APP_ENV: production
    APP_DEBUG: 'false'
    APP_KEY: ${APP_KEY:?Set APP_KEY in .env.production or the deployment environment}
    APP_URL: ${APP_URL:-https://farmer.icdigital.io}
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    DB_CONNECTION: ${DB_CONNECTION:?Set DB_CONNECTION=pgsql in .env.production}
    DB_DATABASE: ${DB_DATABASE:?Set the existing PostgreSQL database name}
    DB_HOST: ${DB_HOST:-farmer-ic-postgres}
    DB_PORT: ${DB_PORT:-5432}
    SESSION_DRIVER: ${SESSION_DRIVER:-file}
    CACHE_STORE: ${CACHE_STORE:-file}
    QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
    NOTIFICATION_QUEUE_CONNECTION: ${NOTIFICATION_QUEUE_CONNECTION:-database}
    DB_QUEUE_RETRY_AFTER: ${DB_QUEUE_RETRY_AFTER:-240}
    REDIS_QUEUE_RETRY_AFTER: ${REDIS_QUEUE_RETRY_AFTER:-240}
    REDIS_HOST: ${REDIS_HOST:-redis}
    REDIS_PREFIX: ${REDIS_PREFIX:?Set an isolated Redis prefix in .env.production}
    QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
    QDRANT_COLLECTION: ${QDRANT_COLLECTION:?Set an isolated Qdrant collection in .env.production}

x-app-service: &app-service
    image: ${APP_IMAGE_REF:-${APP_IMAGE:-farmer-ic}:${APP_TAG:-latest}}
    env_file:
        - .env.production
    environment: *app-environment
    volumes:
        - app_release_storage:/var/www/html/storage
    restart: unless-stopped

services:
    app:
        <<: *app-service
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - '127.0.0.1:${APP_PORT:-8080}:80'
        depends_on:
            postgres:
                condition: service_healthy
                required: false
            redis:
                condition: service_healthy
                required: false
            qdrant:
                condition: service_healthy
                required: false
        deploy:
            resources:
                limits:
                    memory: 512M

    worker:
        <<: *app-service
        command: php artisan queue:work ${QUEUE_CONNECTION:-redis} --queue=ai-index,default --sleep=2 --tries=3 --timeout=180
        profiles: ['rag']
        stop_grace_period: 190s
        healthcheck:
            test: ['CMD-SHELL', 'tr "\0" " " < /proc/1/cmdline | grep -q "queue:work"']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s
        deploy:
            resources:
                limits:
                    memory: 256M

    # One consumer for both queues: concurrent Fonnte validation is unsafe.
    notifications:
        <<: *app-service
        command: php artisan queue:work ${NOTIFICATION_QUEUE_CONNECTION:-database} --queue=notifications,whatsapp --sleep=1 --tries=3 --timeout=30 --max-time=3600
        profiles: ['rag']
        stop_grace_period: 40s
        healthcheck:
            test: ['CMD-SHELL', 'tr "\0" " " < /proc/1/cmdline | grep -q "queue:work"']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s
        deploy:
            resources:
                limits:
                    memory: 256M

    scheduler:
        <<: *app-service
        command: php artisan schedule:work --no-interaction
        profiles: ['rag']
        healthcheck:
            test: ['CMD-SHELL', 'tr "\0" " " < /proc/1/cmdline | grep -q "schedule:work"']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s
        deploy:
            resources:
                limits:
                    memory: 128M

    # Manual, demo-only operation: this command also syncs JSON demo knowledge.
    # It must not run automatically on a database with real operational data.
    indexer:
        <<: *app-service
        profiles: ['indexer']
        command: >-
            sh -lc "php artisan ai:knowledge:index-vector --force --rebuild &&
            php artisan ai:health --json"
        restart: 'no'

    postgres:
        image: postgres:17-alpine
        profiles: ['rag']
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-farmer_ic}
            POSTGRES_USER: ${POSTGRES_USER:-farmer_ic}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        ports:
            - '127.0.0.1:5432:5432'
        networks:
            default:
                aliases:
                    - farmer-ic-postgres
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-farmer_ic}']
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    memory: 512M

    redis:
        image: redis:7-alpine
        profiles: ['rag']
        command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
        volumes:
            - redis_data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 3s
            retries: 5
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    memory: 192M

    qdrant:
        image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.14.1}
        profiles: ['rag']
        expose:
            - '6333'
        volumes:
            - qdrant_storage:/qdrant/storage
        healthcheck:
            test: ['CMD-SHELL', 'kill -0 1 && test -f /qdrant/storage/raft_state.json']
            interval: 30s
            timeout: 5s
            retries: 3
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    memory: 512M

    https-portal:
        image: steveltn/https-portal:1
        ports:
            - '80:80'
            - '443:443'
        restart: always
        volumes:
            - https-portal-data:/var/lib/https-portal
        healthcheck:
            test: ['CMD', 'service', 'nginx', 'status']
            interval: 30s
            timeout: 20s
            retries: 3
        environment:
            DOMAINS: 'farmer.icdigital.io -> http://farmer-ic-app-1:80'
            STAGE: 'production'
            WEBSOCKET: 'true'
            CLIENT_MAX_BODY_SIZE: '0'
            DYNAMIC_UPSTREAM: 'true'
            CUSTOM_NGINX_SERVER_CONFIG_BLOCK: |
                resolver 127.0.0.11 valid=10s ipv6=off;
                proxy_buffer_size 128k;
                proxy_buffers 4 256k;
                proxy_busy_buffers_size 256k;
                proxy_temp_file_write_size 256k;

volumes:
    # The old app_storage is retained for rollback, not shared by the new app.
    app_storage:
    app_release_storage:
    # Retain the legacy volume declaration; do not delete or migrate its data.
    app_database:
    postgres_data:
    redis_data:
    qdrant_storage:
    https-portal-data:

networks:
    default:
        driver_opts:
            com.docker.network.driver.mtu: "1450"
