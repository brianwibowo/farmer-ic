# Local RAG override. Combine with the base app stack:
#
#   docker compose -f compose.yaml -f compose.rag.yaml up --build
#
# PostgreSQL and notification workers are provided by compose.yaml.
# Qdrant is bound to loopback only (127.0.0.1:6333).
# Redis provides queue backend for async indexing jobs.
# The general worker switches to Redis; notifications remain on the database.
services:
    app:
        depends_on:
            postgres:
                condition: service_healthy
            qdrant:
                condition: service_healthy
            redis:
                condition: service_healthy
        environment:
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: ${POSTGRES_DB:-farmer_ic}
            DB_USERNAME: ${POSTGRES_USER:-farmer_ic}
            DB_PASSWORD: ${POSTGRES_PASSWORD:-secret}
            AI_RAG_VECTOR_ENABLED: ${AI_RAG_VECTOR_ENABLED:-true}
            QDRANT_URL: http://qdrant:6333
            QDRANT_API_KEY: ${QDRANT_API_KEY:-}
            QUEUE_CONNECTION: redis
            REDIS_HOST: redis
            CACHE_STORE: redis

    worker:
        command: php artisan queue:work redis --queue=ai-index,default --sleep=2 --tries=3 --timeout=180
        environment:
            QUEUE_CONNECTION: redis
            REDIS_HOST: redis
            CACHE_STORE: redis
            AI_RAG_VECTOR_ENABLED: ${AI_RAG_VECTOR_ENABLED:-true}
            QDRANT_URL: http://qdrant:6333
            QDRANT_API_KEY: ${QDRANT_API_KEY:-}
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            qdrant:
                condition: service_healthy
        deploy:
            resources:
                limits:
                    memory: 256M

    notifications:
        environment:
            QUEUE_CONNECTION: redis
            REDIS_HOST: redis
            CACHE_STORE: redis
        depends_on:
            redis:
                condition: service_healthy

    scheduler:
        environment:
            QUEUE_CONNECTION: redis
            REDIS_HOST: redis
            CACHE_STORE: redis
        depends_on:
            redis:
                condition: service_healthy

    redis:
        image: redis:7-alpine
        ports:
            - '127.0.0.1:${REDIS_PORT:-6379}:6379'
        volumes:
            - redis_data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 3s
            retries: 5
        restart: unless-stopped

    qdrant:
        image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.14.1}
        ports:
            - '127.0.0.1:${QDRANT_PORT:-6333}:6333'
        volumes:
            - qdrant_storage:/qdrant/storage
        healthcheck:
            test: ['CMD-SHELL', 'kill -0 1 && test -f /qdrant/storage/raft_state.json']
            interval: 5s
            timeout: 3s
            retries: 20
            start_period: 10s
        restart: unless-stopped

volumes:
    qdrant_storage:
    redis_data:
