name: Deploy

on:
    workflow_run:
        workflows: [CI]
        types: [completed]

permissions:
    contents: read

concurrency:
    group: deploy-production
    cancel-in-progress: false

jobs:
    deploy:
        name: Build on VPS and deploy
        if: >-
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_branch == 'main'
        runs-on: ubuntu-latest

        steps:
            - name: Build and restart on VPS
              uses: appleboy/ssh-action@v1.2.2
              env:
                  VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH || '/home/clouduser/farmer-ic' }}
                  REPOSITORY: ${{ github.repository }}
                  COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
                  APP_KEY: ${{ secrets.APP_KEY }}
              with:
                  host: ${{ secrets.VPS_HOST || secrets.HOST }}
                  port: ${{ secrets.VPS_PORT || '22' }}
                  username: ${{ secrets.VPS_USER || secrets.VPS_USERNAME || secrets.SSH_USER }}
                  password: ${{ secrets.VPS_PASSWORD }}
                  key: ${{ secrets.VPS_KEY || secrets.SSH_PRIVATE_KEY }}
                  envs: VPS_DEPLOY_PATH,REPOSITORY,COMMIT_SHA,APP_KEY
                  script_stop: true
                  script: |
                      set -eu

                      command -v docker >/dev/null 2>&1 || { echo 'Docker is not installed on the VPS.' >&2; exit 1; }
                      command -v git >/dev/null 2>&1 || { echo 'Git is not installed on the VPS.' >&2; exit 1; }

                      mkdir -p "$VPS_DEPLOY_PATH"
                      if [ ! -d "$VPS_DEPLOY_PATH/.git" ]; then
                        git -C "$VPS_DEPLOY_PATH" init
                      fi
                      if ! git -C "$VPS_DEPLOY_PATH" remote get-url origin >/dev/null 2>&1; then
                        git -C "$VPS_DEPLOY_PATH" remote add origin "https://github.com/$REPOSITORY.git"
                      fi

                      # The previous deploy copied Compose files outside Git;
                      # remove those stale untracked files but keep secrets.
                      git -C "$VPS_DEPLOY_PATH" clean -fd -e .env.production
                      git -C "$VPS_DEPLOY_PATH" fetch --depth 1 origin "$COMMIT_SHA"
                      git -C "$VPS_DEPLOY_PATH" checkout -f -B deploy "$COMMIT_SHA"
                      cd "$VPS_DEPLOY_PATH"

                      touch .env.production
                      chmod 600 .env.production
                      if [ -z "${APP_KEY:-}" ] && ! grep -q '^APP_KEY=.' .env.production; then
                        echo 'APP_KEY secret is required for the first deployment' >&2
                        exit 1
                      fi
                      if ! grep -q '^APP_KEY=.' .env.production; then
                        printf 'APP_KEY=%s\n' "$APP_KEY" >> .env.production
                      fi

                      export APP_IMAGE=farmer-ic
                      export APP_TAG="$COMMIT_SHA"
                      docker compose --env-file .env.production -f compose.production.yaml build --pull app
                      docker compose --env-file .env.production -f compose.production.yaml up -d --no-build --remove-orphans app
                      docker image prune --force
