name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP and frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare test application
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate --force --no-interaction
          php artisan migrate --force --no-interaction

      - name: Run application checks and tests
        run: |
          # Generated Wayfinder files are intentionally excluded from the
          # formatter check; linting, type checking, PHP analysis and tests
          # still run on every change.
          npm run check -- --no-fmt
          npm run types:check
          ./vendor/bin/pint --test
          ./vendor/bin/phpstan analyse --debug --memory-limit=512M --no-progress
          php artisan test

      - name: Build production assets
        run: npm run build

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: farmer-ic:ci
