name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP and frontend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: farmer_ic_crud_test_suite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d farmer_ic_crud_test_suite"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 5432
      TEST_DB_USERNAME: postgres
      TEST_DB_PASSWORD: postgres
      TEST_DB_DATABASE: farmer_ic_crud_test_suite

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_pgsql, gd
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare test application
        run: |
          cp .env.example .env
          php artisan key:generate --force --no-interaction

      - name: Build frontend assets
        run: |
          npm run routes:generate
          npm run build

      - name: Run application checks and tests
        run: |
          # Generated Wayfinder files are intentionally excluded from the
          # formatter check; linting, type checking, PHP analysis and tests
          # still run on every change.
          npm run check -- --no-fmt
          npm run types:check
          ./vendor/bin/pint --test
          ./vendor/bin/phpstan analyse --debug --memory-limit=512M --no-progress
          # Vitest creates a Vite test server, not a production HMR server.
          LARAVEL_BYPASS_ENV_CHECK=1 npx vitest run
          php artisan test

  docker:
    name: Docker build and isolated PostgreSQL smoke test
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Test entrypoint guards
        run: |
          bash tests/Deployment/entrypoint-test.sh
          python3 tests/Deployment/compose-config-test.py
          python3 tests/Deployment/release-image-metadata-test.py

      - name: Prepare disposable test configuration
        run: |
          cat > .env.production <<'EOF'
          APP_KEY=base64:MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          DB_CONNECTION=pgsql
          DB_HOST=farmer-ic-postgres
          DB_DATABASE=farmer_ic
          DB_USERNAME=farmer_ic
          DB_PASSWORD=ci-only-password
          POSTGRES_DB=farmer_ic
          POSTGRES_USER=farmer_ic
          POSTGRES_PASSWORD=ci-only-password
          QUEUE_CONNECTION=redis
          NOTIFICATION_QUEUE_CONNECTION=database
          REDIS_PREFIX=farmer_ic_ci_
          QDRANT_COLLECTION=farmer_ic_ci_knowledge
          FONNTE_ENABLED=false
          EOF

      - name: Build and check image
        run: |
          docker compose --env-file .env.production -f compose.production.yaml --profile rag build app
          docker compose --env-file .env.production -f compose.production.yaml --profile rag up -d --wait postgres redis qdrant
          if docker compose --env-file .env.production -f compose.production.yaml --profile rag run --rm --no-deps app php artisan migrate:status --pending=1 --no-interaction; then
            echo 'Migration preflight unexpectedly passed against an empty database.' >&2
            exit 1
          fi
          docker compose --env-file .env.production -f compose.production.yaml --profile rag run --rm --no-deps app php artisan migrate --force --no-interaction --path=database/migrations/0001_01_01_000001_create_cache_table.php
          if docker compose --env-file .env.production -f compose.production.yaml --profile rag run --rm --no-deps app php artisan migrate:status --pending=1 --no-interaction; then
            echo 'Migration preflight unexpectedly passed with pending migrations.' >&2
            exit 1
          fi
          if docker compose --env-file .env.production -f compose.production.yaml --profile rag run --rm --no-deps -e DB_CONNECTION=sqlite app true; then
            echo 'The PostgreSQL-only image unexpectedly accepted SQLite.' >&2
            exit 1
          fi
          docker compose --env-file .env.production -f compose.production.yaml --profile rag run --rm --no-deps app php artisan migrate --force --no-interaction
          docker compose --env-file .env.production -f compose.production.yaml --profile rag run --rm --no-deps app php artisan migrate:status --pending=1 --no-interaction
          docker compose --env-file .env.production -f compose.production.yaml --profile rag run --rm --no-deps app php docker/verify-release-target.php farmer_ic farmer-ic-postgres redis farmer_ic_ci_ http://qdrant:6333 farmer_ic_ci_knowledge
          if docker compose --env-file .env.production -f compose.production.yaml --profile rag run --rm --no-deps app php docker/verify-release-target.php incorrect_db farmer-ic-postgres redis farmer_ic_ci_ http://qdrant:6333 farmer_ic_ci_knowledge; then
            echo 'Release target check unexpectedly accepted a different database.' >&2
            exit 1
          fi
          if docker compose --env-file .env.production -f compose.production.yaml --profile rag run --rm --no-deps app php docker/verify-release-target.php farmer_ic farmer-ic-postgres redis incorrect_prefix http://qdrant:6333 farmer_ic_ci_knowledge; then
            echo 'Release target check unexpectedly accepted a different Redis prefix.' >&2
            exit 1
          fi
          if docker compose --env-file .env.production -f compose.production.yaml --profile rag run --rm --no-deps app php docker/verify-release-target.php farmer_ic farmer-ic-postgres redis farmer_ic_ci_ http://qdrant:6333 incorrect_collection; then
            echo 'Release target check unexpectedly accepted a different Qdrant collection.' >&2
            exit 1
          fi
          if docker compose --env-file .env.production -f compose.production.yaml --profile rag run --rm --no-deps -e DB_URL=postgresql://invalid/incorrect_db app php docker/verify-release-target.php farmer_ic farmer-ic-postgres redis farmer_ic_ci_ http://qdrant:6333 farmer_ic_ci_knowledge; then
            echo 'Release target check unexpectedly accepted DB_URL.' >&2
            exit 1
          fi
          if docker compose --env-file .env.production -f compose.production.yaml --profile rag run --rm --no-deps -e REDIS_URL=redis://invalid:6379 app php docker/verify-release-target.php farmer_ic farmer-ic-postgres redis farmer_ic_ci_ http://qdrant:6333 farmer_ic_ci_knowledge; then
            echo 'Release target check unexpectedly accepted REDIS_URL.' >&2
            exit 1
          fi
          if docker compose --env-file .env.production -f compose.production.yaml --profile rag run --rm --no-deps -e DB_QUEUE_CONNECTION=pgsql_testing app php docker/verify-release-target.php farmer_ic farmer-ic-postgres redis farmer_ic_ci_ http://qdrant:6333 farmer_ic_ci_knowledge; then
            echo 'Release target check unexpectedly accepted an unchecked queue database.' >&2
            exit 1
          fi
          docker compose --env-file .env.production -f compose.production.yaml --profile rag up -d --wait --no-build --no-deps app worker notifications scheduler
          docker compose --env-file .env.production -f compose.production.yaml exec -T app php -r 'exit(extension_loaded("pcntl") && extension_loaded("redis") && extension_loaded("pdo_pgsql") ? 0 : 1);'
          curl --fail --silent --show-error http://127.0.0.1:8080/up

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image and record its digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -eu
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag farmer-ic:latest "$image:$GITHUB_SHA"
          docker push "$image:$GITHUB_SHA"
          docker image inspect --format '{{json .RepoDigests}}' "$image:$GITHUB_SHA" > "$RUNNER_TEMP/repo-digests.json"
          python3 docker/release-image-metadata.py create \
            --repository "$GITHUB_REPOSITORY" --revision "$GITHUB_SHA" \
            --repo-digests "$RUNNER_TEMP/repo-digests.json" --output "$RUNNER_TEMP/release-image.json"

      - name: Store the tested image reference
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: release-image-${{ github.sha }}
          path: ${{ runner.temp }}/release-image.json
          if-no-files-found: error
          retention-days: 30

      - name: Show container logs on failure
        if: failure()
        run: docker compose --env-file .env.production -f compose.production.yaml --profile rag logs --tail=100
