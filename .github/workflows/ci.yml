name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP and frontend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: farmer_ic_crud_test_suite
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 5432
      TEST_DB_USERNAME: postgres
      TEST_DB_PASSWORD: postgres
      TEST_DB_DATABASE: farmer_ic_crud_test_suite

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare test application
        run: |
          cp .env.example .env
          php artisan key:generate --force --no-interaction

      - name: Build frontend assets
        run: npm run build

      - name: Run application checks and tests
        run: |
          # Generated Wayfinder files are intentionally excluded from the
          # formatter check; linting, type checking, PHP analysis and tests
          # still run on every change.
          npm run check -- --no-fmt
          npm run types:check
          ./vendor/bin/pint --test
          ./vendor/bin/phpstan analyse --debug --memory-limit=512M --no-progress
          php artisan test
