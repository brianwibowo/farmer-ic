# S3 API (Port 9000)
server {
    listen 9000 ssl;
    server_name farmer.iddigital.io;

    ssl_certificate /var/lib/https-portal/farmer.iddigital.io/production/chained.crt;
    ssl_certificate_key /var/lib/https-portal/farmer.iddigital.io/production/domain.key;

    client_max_body_size 0;
    proxy_buffering off;

    location / {
        proxy_pass http://192.168.1.11:9000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Web Console / Dashboard RustFS (Port 9001)
server {
    listen 9001 ssl;
    server_name farmer.iddigital.io;

    ssl_certificate /var/lib/https-portal/farmer.iddigital.io/production/chained.crt;
    ssl_certificate_key /var/lib/https-portal/farmer.iddigital.io/production/domain.key;

    client_max_body_size 0;

    location / {
        proxy_pass http://192.168.1.11:9001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}