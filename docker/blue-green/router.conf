server {
    listen 80;
    resolver 127.0.0.11 valid=2s ipv6=off;
    include /etc/nginx/release-route/active.conf;

    location = /router-health {
        access_log off;
        return 200 "ok\n";
    }

    # A browser with an older page may still request its hashed Vite assets.
    # Keep the previous slot running and use it only for missing build assets.
    location ^~ /build/assets/ {
        proxy_intercept_errors on;
        error_page 404 = @previous_asset;
        proxy_pass $release_backend;
        proxy_set_header Host $host;
        add_header X-Farmer-Release-Slot $release_slot always;
    }

    location @previous_asset {
        proxy_pass $release_previous;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass $release_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 2h;
        add_header X-Farmer-Release-Slot $release_slot always;
    }
}
