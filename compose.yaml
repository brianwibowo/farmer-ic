services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: farmer-ic:local
        ports:
            - '${APP_PORT:-8080}:80'
        env_file:
            - path: .env.docker
              required: false
        environment:
            APP_ENV: production
            APP_DEBUG: 'false'
            APP_URL: ${APP_URL:-http://localhost:8080}
            DB_CONNECTION: sqlite
            DB_DATABASE: /var/lib/farmer-ic/database.sqlite
            SESSION_DRIVER: file
            CACHE_STORE: file
            QUEUE_CONNECTION: sync
        volumes:
            - app_storage:/var/www/html/storage
            - app_database:/var/lib/farmer-ic
        restart: unless-stopped

volumes:
    app_storage:
    app_database:
